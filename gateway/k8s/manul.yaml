# Manul's gateway (Bifrost) and account service, in namespace manul on the silverfish cluster. Applied by deploy.sh.
# Public: gateway.manul.si (/openai, /v1: the models, Manul keys only) and account.manul.si (/v1/key: signing in).
# Private: Bifrost's dashboard and admin API (/api): kubectl -n manul port-forward svc/bifrost 8089:8080.
apiVersion: v1
kind: Namespace
metadata:
  name: manul
---
# Bifrost keeps everything in Postgres (database bifrost on the silverfish Cloud SQL instance, see config.json);
# /app/data only holds the mounted config and scratch files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost
  namespace: manul
spec:
  replicas: 1
  selector:
    matchLabels: { app: bifrost }
  template:
    metadata:
      labels: { app: bifrost }
    spec:
      nodeSelector: { pool: system }
      securityContext: { runAsUser: 1000, runAsGroup: 0, fsGroup: 1000 }
      containers:
        - name: bifrost
          image: maximhq/bifrost:v2.2.6
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ secretRef: { name: manul-secrets } }]
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: config, mountPath: /app/data/config.json, subPath: config.json, readOnly: true }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap: { name: bifrost-config }
---
apiVersion: v1
kind: Service
metadata:
  name: bifrost
  namespace: manul
  annotations:
    cloud.google.com/backend-config: '{"default": "bifrost"}'
spec:
  selector: { app: bifrost }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: bifrost
  namespace: manul
spec:
  timeoutSec: 3600                # a long agent turn streams for minutes
  connectionDraining: { drainingTimeoutSec: 30 }
  healthCheck: { type: HTTP, requestPath: /health, port: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
  namespace: manul
spec:
  replicas: 2
  selector:
    matchLabels: { app: account }
  template:
    metadata:
      labels: { app: account }
    spec:
      nodeSelector: { pool: system }
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: account
          image: node:24.11.1-alpine
          command: [node, /app/server.mjs]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: CLERK_ISSUER, value: https://good-wildcat-5360.clerk.accounts.dev }
            - { name: BIFROST_URL, value: "http://bifrost:8080" }   # the admin API, inside the cluster only
            - { name: CLERK_SECRET_KEY, valueFrom: { secretKeyRef: { name: manul-secrets, key: CLERK_SECRET_KEY } } }
            - { name: BIFROST_AUTH, valueFrom: { secretKeyRef: { name: manul-secrets, key: BIFROST_AUTH } } }
          volumeMounts: [{ name: code, mountPath: /app, readOnly: true }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: code
          configMap: { name: account-code }
---
apiVersion: v1
kind: Service
metadata:
  name: account
  namespace: manul
  annotations:
    cloud.google.com/backend-config: '{"default": "account"}'
spec:
  selector: { app: account }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: account
  namespace: manul
spec:
  timeoutSec: 30
  healthCheck: { type: HTTP, requestPath: /healthz, port: 8080 }
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: manul
  namespace: manul
spec:
  domains: [gateway.manul.si, account.manul.si]
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: manul
  namespace: manul
spec:
  redirectToHttps: { enabled: true }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: manul
  namespace: manul
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: manul-gateway
    networking.gke.io/managed-certificates: manul
    networking.gke.io/v1beta1.FrontendConfig: manul
spec:
  defaultBackend:                 # anything else (the dashboard, /api…) gets the account service's 404
    service: { name: account, port: { number: 8080 } }
  rules:
    - host: gateway.manul.si
      http:
        paths:
          - { path: /openai, pathType: Prefix, backend: { service: { name: bifrost, port: { number: 8080 } } } }
          - { path: /v1, pathType: Prefix, backend: { service: { name: bifrost, port: { number: 8080 } } } }
    - host: account.manul.si
      http:
        paths:
          - { path: /v1/key, pathType: Exact, backend: { service: { name: account, port: { number: 8080 } } } }
