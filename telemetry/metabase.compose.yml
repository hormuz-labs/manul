services:
  metabase-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabase
      POSTGRES_DB: metabase
      POSTGRES_PASSWORD: ${MB_DB_PASSWORD}
    volumes:
      - metabase_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.63.5
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3300:3000"
    user: "1005:1005"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${MB_DB_PASSWORD}
      JAVA_TIMEZONE: UTC
    volumes:
      # SQLite is an aggregate-only read source; no raw installation identifiers.
      - ./analytics.sqlite:/data/analytics.sqlite:ro

volumes:
  metabase_db:
