# Manul's own ffmpeg + ffprobe (scripts/ffmpeg/build.sh: Martin Riedl's build plus vid.stab and Rubber Band), for every
# platform Manul ships. Changes to the build are built here to check them; running it by hand with a release tag also
# publishes the zips as a GitHub prerelease (never "latest", so the app's updater and the Homebrew tap ignore it).
# Then pin the printed SHA-256s and the tag in scripts/fetch-ffmpeg.mjs.
name: ffmpeg
on:
  push:
    branches: [main]
    paths: ["scripts/ffmpeg/**", ".github/workflows/ffmpeg.yml"]
  pull_request:
    paths: ["scripts/ffmpeg/**", ".github/workflows/ffmpeg.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish as this release tag, e.g. ffmpeg-9.0.2-1 (empty: build only)"
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool gperf curl zip bzip2 git python3-venv python3-virtualenv
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool
          python3 -m pip install --user --break-system-packages virtualenv
      - name: Rust + cargo-c (rav1e)
        run: |
          rustup update stable
          cargo install cargo-c --locked
      - name: Build
        run: ./scripts/ffmpeg/build.sh
      - name: Name the files for the release
        run: |
          cd dist/ffmpeg/${{ matrix.target }}
          mv ffmpeg.zip ffmpeg-${{ matrix.target }}.zip
          mv ffprobe.zip ffprobe-${{ matrix.target }}.zip
          mv buildconf.txt buildconf-${{ matrix.target }}.txt
          shasum -a 256 *.zip | tee SHA256-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: dist/ffmpeg/${{ matrix.target }}/*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          merge-multiple: true
          path: out
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          cat out/SHA256-*.txt > out/SHA256SUMS.txt
          rm out/SHA256-*.txt
          gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$TAG (bundled ffmpeg)" --notes "Manul's bundled ffmpeg/ffprobe, built by scripts/ffmpeg/build.sh. Not an app release."
          cat out/SHA256SUMS.txt
