# When bundled skills change on main, sign them into the over-the-air feed (updates/skills.json).
name: Publish skills
on:
  push:
    branches: [main]
    paths: ["resources/skills/**"]

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign the skills feed
        env:
          MANUL_SKILLS_KEY: ${{ secrets.MANUL_SKILLS_KEY }}
        run: node --experimental-strip-types --no-warnings scripts/sign-skills.mjs
      - name: Commit the feed
        run: |
          git config user.name agenthormuz
          git config user.email 275594696+hormuz-labs@users.noreply.github.com
          git add updates/
          git commit -m "Publish skills feed" || exit 0
          git push
