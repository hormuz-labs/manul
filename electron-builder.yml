# Native packaging: macOS (.dmg + .zip), Linux (.deb + AppImage), Windows x64 (per-user NSIS).
appId: com.hormuzlabs.manul
productName: Manul
copyright: Copyright © 2026 Hormuz Labs
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
beforePack: scripts/before-pack.cjs
# Manul's own tools and assets live next to the app, never inside the asar archive
extraResources:
  - from: resources/bin/${platform}-${arch}
    to: bin
    filter: ["ffmpeg", "ffprobe", "whisper-cli", "bsk", "*.exe", "*.dll", "*.DLL", "*-LICENSE.txt", "*-README.txt"]
  - from: resources/lib
    to: lib
  - from: resources/skills
    to: skills
  # BrowserSkill's extension, run inside Manul's own browser (scripts/fetch-bsk.mjs)
  - from: resources/bsk-ext
    to: bsk-ext
    filter: ["**/*", "!.sha256"]
  - from: resources/py
    to: py
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE
  - from: resources/skills-public.pem
    to: skills-public.pem
mac:
  category: public.app-category.video
  target:
    - target: dmg
    - target: zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon.icns
  minimumSystemVersion: "12.0"
dmg:
  title: Manul
  artifactName: Manul-${version}-${arch}.dmg
win:
  executableName: Manul
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Manul-${version}-windows-${arch}-Setup.exe
  verifyUpdateCodeSignature: true
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    # Exact publisherName is injected from WINDOWS_PUBLISHER_NAME by scripts/package.mjs.
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Manul
  deleteAppDataOnUninstall: false
  uninstallDisplayName: Manul
  # No acceptance page or directory wizard. LICENSE still ships in extraResources.
linux:
  category: AudioVideo
  icon: build/icons
  maintainer: Hormuz Labs <hello@hormuz-labs.dev>
  synopsis: An agentic video editor
  description: Drop in a video, say what you want, and Manul does the edit.
  target:
    - target: deb
    - target: AppImage
  artifactName: manul_${version}_${arch}.${ext}
deb:
  packageCategory: video
  priority: optional
  # electron-builder's defaults plus ALSA, which Electron links against; without it the app won't start on a clean system.
  # Ubuntu 24.04 renamed it libasound2t64.
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, "libasound2t64 | libasound2"]
publish:
  provider: github
  owner: hormuz-labs
  repo: manul
  releaseType: release
